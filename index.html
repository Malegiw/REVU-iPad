<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review by YMD · Kalkulator</title>
<meta name="description" content="Kalkulator dan referensi teknik sipil untuk reviewer, berjalan offline di iPad.">
<meta name="theme-color" content="#27323F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YMD Kalkulator">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/flow.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Review by YMD">
    <span class="mark">YMD</span><span class="bt"><b>Review by YMD</b><small id="sub"></small></span>
  </a>
  <nav id="nav" class="nav" aria-label="Menu"></nav>
  <div class="tools">
    <span id="offline" class="chip" hidden></span>
    <button id="btnLang" class="tb" type="button" aria-label="Bahasa / Language"></button>
    <button id="btnTheme" class="tb" type="button" aria-label="Tema / Theme"></button>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><p style="padding:24px">Aplikasi ini membutuhkan JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>

</html>
