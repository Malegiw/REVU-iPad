<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Tiang listrik: isolator, kawat tiga fasa dengan gelombang bergeser 120 derajat, arrester, fuse cut-out, pentanahan, dan pondasi tiang">
<defs>
  <linearGradient id="dsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFAF7"/><stop offset=".7" stop-color="#EDEAE3"/><stop offset="1" stop-color="#D9D5CC"/></linearGradient>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V8" stroke="#44566A" stroke-width="1.6" opacity=".75"/></pattern>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="1.3" fill="#44566A" opacity=".35"/><circle cx="10" cy="10" r="1.1" fill="#44566A" opacity=".3"/></pattern>
