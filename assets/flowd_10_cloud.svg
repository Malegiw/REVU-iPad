  .sm{font-size:14.5px;font-weight:600;fill:#1F2430;paint-order:stroke;stroke:#FBFAF7;stroke-width:4px;stroke-linejoin:round}
  @keyframes d-flow{to{stroke-dashoffset:-84}}
  @keyframes d-fall{0%{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(var(--fall,60px));opacity:0}}
  @keyframes d-rise{0%{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(var(--rise,-60px));opacity:0}}
  @keyframes d-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  .smoke{animation:d-smoke 5s ease-out infinite;opacity:0} .s2{animation-delay:1.7s} .s3{animation-delay:3.3s}
  @keyframes d-smoke{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.55}100%{opacity:0;transform:translate(34px,-70px) scale(2.2)}}
  @keyframes d-blink{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes fl{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.88,1.12) skewX(5deg)}50%{transform:scale(1.08,.94) skewX(-4deg)}75%{transform:scale(.94,1.08) skewX(3deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
