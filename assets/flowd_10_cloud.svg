<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Waterflood: pompa injeksi menekan air ke sumur injeksi, front air menyapu reservoir dan mendorong minyak ke sumur produksi">
<defs>
