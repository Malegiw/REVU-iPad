<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Wash tank atau gun barrel: minyak naik melewati lapisan air, tetes air mengendap, minyak bersih melimpas keluar">
<defs>
