  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V8" stroke="#A9BDD0" stroke-width="1.6" opacity=".75"/></pattern>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="1.3" fill="#A9BDD0" opacity=".35"/><circle cx="10" cy="10" r="1.1" fill="#A9BDD0" opacity=".3"/></pattern>
