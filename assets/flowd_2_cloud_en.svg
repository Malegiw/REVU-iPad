<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Penampang sumur ESP: kepala sumur, VSD, kabel, tubing, pompa bertingkat, intake, protector, motor, dan perforasi">
<defs>
